<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Student Placement Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🎓 AI Student Placement Predictor</h1>

        <p class="subtitle">
            Enter student details to predict placement probability using Machine Learning.
        </p>

        <form action="/predict" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" min="18" max="30" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>CGPA</label>
                    <input type="number" name="cgpa" step="0.01" min="0" max="10" required>
                </div>

                <div class="form-group">
                    <label>10th Percentage</label>
                    <input type="number" name="tenth" step="0.01" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>12th Percentage</label>
                    <input type="number" name="twelfth" step="0.01" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Aptitude Score</label>
                    <input type="number" name="aptitude" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Coding Score</label>
                    <input type="number" name="coding" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Communication Score</label>
                    <input type="number" name="communication" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Technical Skills (1-10)</label>
                    <input type="number" name="technical" min="1" max="10" required>
                </div>

                <div class="form-group">
                    <label>Certifications</label>
                    <input type="number" name="certifications" min="0" max="20" required>
                </div>

                <div class="form-group">
                    <label>Internship Experience</label>
                    <input type="number" name="internship" min="0" max="5" required>
                </div>

                <div class="form-group">
                    <label>Projects</label>
                    <input type="number" name="projects" min="0" max="20" required>
                </div>

            </div>

            <button type="submit">
                🔮 Predict Placement
            </button>

        </form>

    </div>

</div>

</body>
</html>
